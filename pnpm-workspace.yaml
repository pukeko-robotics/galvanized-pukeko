packages:
  - 'packages/galvanized-pukeko-vue-ui'
  - 'packages/galvanized-pukeko-web-client'

# Strict mode: refuse an immature package outright rather than install it and
# append an exception here. A refusal is this guard working, not a broken build.
#
# Remedies, in order of preference: wait out the 24-hour window and install
# again; pin the older mature version deliberately; or, only if it is genuinely
# urgent, have a HUMAN add a reviewed and explicitly temporary exclusion and
# remove it once the version has aged. It is never "add the package so the build
# goes green" — that is the behaviour strict mode exists to stop.
#
# It looks inert at first: the flag is not part of pnpm's lockfile-verification
# cache key, so where this lockfile is already verified the check is skipped and
# an install exits 0 in about 200 ms having checked nothing. It starts biting
# when the lockfile next changes.
#
# The window is 1440 minutes — the 24 hours the remedies above name. It is
# written out rather than left to pnpm's default because that default is
# undocumented: measured on pnpm 11.3.0 (the version `packageManager` pins
# here), an absent value enforced this very same 24-hour cutoff, so this line
# changes nothing today, and a future pnpm that moved its default could not
# silently falsify the 24 hours promised above. Two careful readers had already
# taken the missing value for a window of length zero (OPS-128).
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# These are packages we publish ourselves, so they are listed bare (OPS-115): a
# bare name matches every version, and nothing here needs a hand edit when one of
# our releases lands.
#
# ONE entry per package name. pnpm returns on the first rule whose name matches
# and never consults a later one, so a second entry for the same package is
# silently ignored and the exception it names is not in force — including the
# plain `name@version` line `pnpm install` appends for itself when it meets an
# immature package, which lands after these and is dead on arrival. Splitting a
# package's versions into a line per version looks tidier and switches the
# exception off with no error anywhere.
#
# A bare entry already grants every version, so pnpm never has anything to append
# for our own packages: an appended line here is third-party by construction, and
# worth a look before it is kept.
minimumReleaseAgeExclude:
  - '@gaunt-sloth/agent'
  - '@gaunt-sloth/core'

# @gaunt-sloth/agent is consumed from the public npm registry (2.0.0-beta.x);
# no cross-repo file: redirect is needed — the published package pins its own
# @gaunt-sloth/core by version. The uuid floor keeps a single resolved copy.
overrides:
  uuid: '>=11.1.1'
  # Hold the gaunt-sloth subtree on zod 4, scoped so this repo's own zod 3 and
  # zod-to-json-schema@3 are untouched — that isolation is the point (GS2-15)
  # and stays whatever these three do. @gaunt-sloth/* now declares `^4.4.3`,
  # which admits no zod 3, so pnpm can no longer dedupe the subtree onto zod 3
  # and these entries are redundant rather than load-bearing. Removing them is
  # its own ticket: measure the resolved zod copies before and after, because
  # the failure they were added for was a silent boot crash in the AG-UI server.
  '@gaunt-sloth/core>zod': '^4.0.0'
  '@gaunt-sloth/agent>zod': '^4.0.0'
  '@gaunt-sloth/review>zod': '^4.0.0'
