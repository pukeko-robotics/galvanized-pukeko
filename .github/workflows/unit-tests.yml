name: Unit tests

# OPS-74: the ordinary-path gate. Runs `pnpm test` on every push and every pull
# request, and is also the reusable body that release.yml calls as its gate 1, so
# the release pipeline and the push path can never test different things.
#
# `pnpm test` here is three chained steps, in this order:
#   1. scripts/check-no-bare-launchers.mjs — the QA-19 one-shot-package-runner guard
#   2. pnpm run lint  — the OPS-52 repository-scoped oxlint pass, which also covers
#      the root-level harnesses, e2e/ and scripts/ that no workspace-scoped script
#      reaches
#   3. pnpm -r run test — the workspace unit suites (vue-ui + web-client)
#
# OPS-85 then runs `pnpm run build`, and OPS-87 made that step carry every
# type-check this repository has. It is now three things in order:
#   1. the root `type-check` — `tsc -p tsconfig.tooling.json`, the OPS-87 project
#      covering playwright.config.ts, e2e/*.spec.ts, scripts/*, the it-*.js
#      harnesses and the start-*.js launchers, none of which belonged to any
#      project before
#   2. vue-ui's build, which begins with its own `type-check` before the two
#      bundler passes. That script is two projects: `vue-tsc` over `src/` and
#      `env.d.ts`, then `tsc -p tsconfig.tooling.json` — the OPS-104 project
#      covering that package's own vite.config.ts, vite.copilot.config.ts,
#      vitest.config.ts and playwright.config.ts, which belonged to no project
#      at all until it existed
#   3. web-client's build, which has always begun with `vue-tsc --build`
#
# So the Build step SUBSUMES all three type-check passes. Running `type-check` as
# a separate step here would be a second name for work this step already does,
# and a reader seeing both listed would reasonably assume they covered different
# things. Keeping them inside `build` is also why OPS-87 added no job and changed
# no check name: branch protection learns nothing new.
#
# WHY THE SAME JOB, NOT A PARALLEL ONE. A parallel job is a second independently
# named check, and each name has to be added to branch protection separately —
# operational cost paid by a human, for no extra coverage. The price of a single
# job is fail-fast: a lint failure masks a type error until it is fixed. That is
# acceptable for a gate whose purpose is to stop the merge either way.
#
# The build runs AFTER `pnpm test`, because the QA-19 guard is the first link of
# that chained command and must stay the first thing this job runs — a job that
# type-checks before it checks for one-shot package runners has put the cheap
# convenience ahead of the reason the trigger exists. Splitting the guard out to
# reorder would fork the exact command release.yml depends on.
#
# WHAT THIS CHECK DOES NOT COVER. A green tick here is narrower than "CI passed",
# and the point of this workflow is undone if anyone reads it as more:
#   - The root-level JavaScript is PARSED, not type-checked. tsconfig.tooling.json
#     sets `allowJs` with `checkJs` off, so a syntax error in the it-*.js
#     harnesses, the start-*.js launchers or scripts/*.mjs now fails this job and
#     a type error in them still does not. That boundary is deliberate and its
#     measurement is recorded in that file. The five TypeScript files it covers
#     are fully checked under `strict`.
#   - vue-ui's e2e/ is in no project. The gap that used to be recorded here — the
#     four config files inside that package — is closed: OPS-104 gave them their
#     own tooling project, reached through the package's `type-check` and so
#     through the Build step above, which is what makes a nonexistent plugin
#     option fail this job rather than pass unread (OPS-91). Its e2e/ is not
#     covered by that project or any other. e2e/harness.ts imports .vue
#     single-file components directly and e2e/theme.visual.spec.ts pulls that
#     file in, so both need vue-tsc and the dom lib rather than the node22
#     project their siblings use — added to it they report TS2307 on the
#     component imports instead of checking anything. Only
#     e2e/vite.harness.config.ts would fit as-is. So that directory wants its own
#     project, not a wider `include`. web-client has neither gap: its
#     tsconfig.node.json covers vite.config.ts, vitest.config.ts and
#     eslint.config.ts, and tsconfig.vitest.json covers its tests/.
#   - examples/ and experiments/ are outside all of it. They sit outside the pnpm
#     workspace, so `pnpm -r` never reaches them, and outside tsconfig.tooling.json,
#     which is scoped to the root's own files. Two of them carry their own tsconfig
#     that no script here runs. That is roughly twenty TypeScript and Vue files —
#     including examples/adk-ui-agent-to-adk-agent/playwright.config.ts and its
#     e2e-tests/example.spec.ts — behind nothing but the oxlint pass above.
#   - No end-to-end tests. The Koog and ADK Playwright suites are gate 2 of
#     release.yml and stay commented out there.
#   - No Java or Kotlin. The agent-adk package is outside the pnpm workspace, so
#     `pnpm -r run test` never reaches it; only the oxlint pass looks at that tree
#     at all, and only at its non-Java files.
#
# WHY THE E2E HALF IS NOT ON THIS TRIGGER. It is not merely that a booted stack is
# expensive. A pull request from a fork gets a read-only token and no repository
# secrets, and the e2e suites need GOOGLE_API_KEY, so on the pull_request trigger
# they could not authenticate at all and would fail for a reason that says nothing
# about the change. They belong on a deliberate trigger with access to secrets:
# gate 2 of release.yml, to be uncommented once the key and the Maven Central
# kotlin-core dependency named in release.yml's header are in place.
#
# `push` is deliberately unfiltered, matching lockfile-guard.yml. A same-repo pull
# request therefore runs this twice, once for each trigger; that is the existing
# repository convention and the cost is one short job.

on:
  push:
  pull_request:
  workflow_call:

jobs:
  unit-tests:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Tests
        run: pnpm test
      - name: Build
        run: pnpm run build
